joy_node:
  ros__parameters:
    dev: /dev/input/js0

joy_teleop:
  ros__parameters:

    manual_control:
      type: topic
      interface_type: geometry_msgs/msg/Twist
      topic_name: /cmd_vel
      # LB (button 4) as the deadman: a button is cleanly 0/1, so it works as a
      # momentary hold. A trigger axis (e.g. LT = axis 2) does NOT: it reads 0.0
      # until first touched, then rests at +1.0 when released and -1.0 when
      # pressed. joy_teleop's deadman_axes activates on '== 1.0', so a trigger
      # latches ON when released and can't be held to drive.
      deadman_buttons: [4]
      axis_mappings:
        linear-x:
          axis: 1
          scale: 0.4
          offset: 0
        linear-y:
          axis: 0
          scale: 0.4
          offset: 0
        linear-z:
          axis: 4
          scale: 0.4
          offset: 0
        angular-z:
          axis: 3
          scale: 1.0
          offset: 0
